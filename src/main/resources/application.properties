spring.application.name=zelacidade-api

# Em casa, as variáveis podem vir do arquivo .env (que NÃO vai para o Git nem para o zip).
# No Render elas vêm do painel (Environment). Nenhuma senha fica neste arquivo.
spring.config.import=optional:file:.env[.properties]

# Porta: o Render informa pela variável PORT; local usa 8080
server.port=${PORT:8080}

# Banco Oracle da FIAP: só nomes de variáveis, nunca os valores
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexões (HikariCP): poucas conexões, o plano gratuito do Oracle da FIAP é limitado
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Rota inexistente vira 404 em JSON (tratado no TratadorDeErros), não página HTML
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# JSON: datas como texto (2026-11-16), não como número
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
